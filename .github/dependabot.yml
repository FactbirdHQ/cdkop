version: 2

# The cooldown holds back a release for a few days so a compromised version has
# time to be pulled first. Security updates ignore it.
updates:
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      bun:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
